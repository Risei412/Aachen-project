# Configuration for the widefield ODMR application (ODMR/odmr_app.py).
# Copy this file if you need per-session variants, e.g. config_run2.yaml,
# and point the app at it with: python odmr_app.py --config config_run2.yaml

mock: true            # true = run with simulated camera/generator (no hardware needed)

camera:
  exposure_ms: 50.0    # camera exposure time per frame, in milliseconds.
                       # Adjustable live from the GUI slider; this is the
                       # starting value. Watch the "% saturated" readout in
                       # the live-view title: saturated pixels are clipped and
                       # can show no ODMR contrast at all.
  exposure_limits_ms: [0.05, 1000.0]   # slider range (log scale). The camera
                       # clamps to its own hardware limits regardless.
  binning: 2           # average NxN pixel blocks; shrinks the datacube by N^2
                       # and improves per-pixel SNR. Use 1 for full resolution.
  dll_dir: "C:/Program Files/Thorlabs/Scientific Imaging/Scientific Camera Support/Scientific Camera Interfaces/SDK/Native Toolkit/dlls/Native_64_lib"
                       # folder with the Thorlabs native DLLs (thorlabs_tsi_camera_sdk.dll
                       # and friends). Required for real hardware -- pip installing
                       # thorlabs_tsi_sdk alone does not make these loadable. Match
                       # Native_64_lib / Native_32_lib to your Python's bitness.
                       # Adjust the path to match your ThorCam SDK install location.

microwave:
  port: "COM7"         # Windows: COMx. Linux: /dev/ttyACM0 or /dev/ttyUSB0
  channel: 0           # 0 = channel A, 1 = channel B
  power_dbm: 0.0        # RF power sent to the MW antenna/loop near the sample
  freq_limits_mhz: [54.0, 13600.0]   # generator's tuning range, used to reject
                        # out-of-range sweep entries typed into the GUI.
                        # SynthHD is 54 MHz - 13.6 GHz; SynthHD PRO is 10 MHz - 15 GHz.
                        # Check your unit and adjust.

sweep:
  start_mhz: 2800.0     # start frequency of the ODMR sweep
  stop_mhz: 2940.0      # stop frequency of the ODMR sweep
  step_mhz: 1.0          # frequency step size
  settle_ms: 30.0         # wait after setting frequency, before capturing a frame.
                          # Set >= exposure_ms so the PLL has locked and the next
                          # exposure starts cleanly at the new frequency.
  frames_per_point: 5     # frames averaged at each frequency (reduces shot noise)
  discard_frames: 1       # frames thrown away right after each frequency change.
                          # A free-running camera may already be mid-exposure when
                          # the frequency changes, so that frame straddles two
                          # frequencies and blurs adjacent points together.
  repeats: 6              # how many times to repeat the whole sweep and average.
                          # SNR improves as sqrt(repeats); total time scales linearly.
  alternate_direction: true   # run every 2nd repeat high->low. Slow drift (laser
                          # power, NV bleaching, sample creep) otherwise correlates
                          # with frequency, since frequency is always visited in the
                          # same time order, and can tilt or fake a lineshape.
                          # Alternating makes the drift cancel on averaging instead.
  estimate_errors: true   # also accumulate sum-of-squares so the spectrum gets error
                          # bars from the scatter between repeats. Doubles the memory
                          # used while acquiring. No effect when repeats is 1.
  early_stop:             # stop repeating as soon as the data is good enough,
                          # instead of always running all `repeats`
    enabled: true
    sigma: 10.0           # field-averaged dip must be at least this many noise levels deep
    roi_noise_pct: 0.2    # AND a typical ROI (roi.half_size_px) must be this quiet, so a
                          # clicked spot shows a readable spectrum. null = ignore this test.
    min_repeats: 2        # never stop before this many repeats. With alternate_direction
                          # the stop also waits for an even count (forward+backward pairs).
  zoom:                   # measure the flat baseline sparsely, the resonances finely
    enabled: true
    survey_step_mhz: 4.0  # a quick coarse pass over start..stop at this step finds the dips
    survey_repeats: 1
    margin_mhz: 8.0       # extra fine range each side of a dip found by the survey
    depth_fraction: 0.1   # a dip's window ends where it is shallower than this fraction
                          # of its own depth
    baseline_step_mhz: 5.0   # spacing of the points kept outside the dips, so the
                          # baseline fit still sees both sides. If the survey finds no
                          # dip, the full range is measured at step_mhz as before.

roi:
  half_size_px: 15      # clicked point +/- this many (binned) pixels is averaged
                        # into the displayed ODMR spectrum. Adjustable live from the
                        # GUI slider; it re-reads the existing datacube, so changing
                        # it after a sweep costs nothing.
  half_size_limits: [1, 60]   # range of the ROI slider

analysis:
  min_signal_fraction: 0.15   # contrast-map threshold: pixels dimmer than this
                              # fraction of the brightest pixel are blanked, so
                              # shot noise in dark areas doesn't swamp the scale
  baseline_correction: true   # normalise the spectrum against a robustly fitted
                              # straight line rather than the single brightest
                              # point (where one upward noise spike would define
                              # 100 % and inflate the apparent contrast). Also
                              # removes linear baseline tilt left by slow drift.
                              # The fit iteratively rejects points lying below it,
                              # one-sided because a resonance can only darken the
                              # PL, so it finds the off-resonance level wherever
                              # the dips happen to sit in the sweep.
  baseline_reject_sigma: 2.5  # reject points this many robust sigma BELOW the fit
  baseline_iterations: 8      # max refit iterations

diagnostic:                   # settings for the "MW check" button (quick NV response test)
  check_freq_mhz: 2870.0      # frequency to park the MW at. Use a KNOWN resonance:
                              # 2870 MHz is the NV zero-field-splitting frequency.
                              # If there's a bias field splitting the resonances,
                              # use one of the split dip frequencies instead. Once a
                              # sweep has run, the app ignores this and uses the
                              # deepest dip it actually measured.
  cycles: 50                  # interleaved OFF-ON-ON-OFF (ABBA) cycles to average
  discard_frames: 1           # frames discarded after each RF switch
  settle_ms: 30.0             # wait after each RF switch; set >= camera exposure_ms

output:
  directory: "data"            # "Save raw" writes full .npz datacubes here.
                               # Git-ignored: a sweep is hundreds of MB.
  results_directory: "results" # "Export" writes small publishable bundles here
                               # (metadata, spectra CSV, plots, maps). These ARE
                               # tracked by git -- push them with publish_results.py
