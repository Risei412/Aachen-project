# Configuration for the widefield ODMR application (ODMR/odmr_app.py).
# Copy this file if you need per-session variants, e.g. config_run2.yaml,
# and point the app at it with: python odmr_app.py --config config_run2.yaml

mock: true            # true = run with simulated camera/generator (no hardware needed)

camera:
  exposure_ms: 20.0    # camera exposure time per frame, in milliseconds
  binning: 2           # average NxN pixel blocks; shrinks the datacube by N^2
                       # and improves per-pixel SNR. Use 1 for full resolution.

microwave:
  port: "COM7"         # Windows: COMx. Linux: /dev/ttyACM0 or /dev/ttyUSB0
  channel: 0           # 0 = channel A, 1 = channel B
  power_dbm: 0.0        # RF power sent to the MW antenna/loop near the sample

sweep:
  start_mhz: 2800.0     # start frequency of the ODMR sweep
  stop_mhz: 2940.0      # stop frequency of the ODMR sweep
  step_mhz: 1.0          # frequency step size
  settle_ms: 5.0          # wait time after setting frequency, before capturing a frame
  frames_per_point: 3     # frames averaged at each frequency (reduces shot noise)

roi:
  half_size_px: 8       # clicked point +/- this many (binned) pixels is averaged
                        # into the displayed ODMR spectrum

analysis:
  min_signal_fraction: 0.15   # contrast-map threshold: pixels dimmer than this
                              # fraction of the brightest pixel are blanked, so
                              # shot noise in dark areas doesn't swamp the scale

output:
  directory: "data"     # where "Save" writes the .npz datacubes
